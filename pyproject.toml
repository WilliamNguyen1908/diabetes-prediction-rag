[project]
name = "diabetes-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Model (pinned to Colab training versions — must match to load the saved model)
    "pandas==2.2.2",
    "scikit-learn==1.6.1",
    "xgboost==3.3.0",
    "numpy",
    "joblib",
    # Visualization / notebook
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "ipykernel",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.0",
    "pysbd>=0.3.4",
    "pymupdf4llm>=1.28.0",
    "rank-bm25>=0.2.2",
    "ollama>=0.6.2",
    "anthropic>=0.116.0",
]

[dependency-groups]
eval = [
    "langchain>=0.3,<1.0",
    "langchain-anthropic>=0.3.22",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<1.0",
    "langchain-ollama>=0.2,<1.0",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.5",
]
